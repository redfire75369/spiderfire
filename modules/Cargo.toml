[package]
name = "modules"
version = "0.1.0"

edition.workspace = true
license.workspace = true
authors = ["Redfire <redfire75369@hotmail.com>"]

[dependencies]
chrono.workspace = true
idna_adapter.workspace = true # Prevents Duplicate icu 2.x.x
idna.workspace = true
mozjs.workspace = true
runtime.workspace = true

[dependencies.ion]
workspace = true
features = ["macros"]

[dependencies.tokio]
workspace = true
features = ["fs"]

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Storage_FileSystem"]

[dev-dependencies.tokio]
workspace = true
features = ["macros", "rt"]

[features]
debugmozjs = ["ion/debugmozjs"]

[lints]
workspace = true

[lib]
doctest = false
test = false
