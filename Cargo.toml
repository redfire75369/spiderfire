cast_ptr_alignment = "deny"
mut_mut = "deny" # Used in pin_project!
needless_pass_by_value = "deny" # Used in #[js_fn] and #[js_class]
redundant_type_annotations = "deny" # Used in #[js_fn] and #[js_class]
ref_option_ref = "deny" # Used in pin_project!
same_name_method = "deny" # Used in bitflags! and #[js_class]
