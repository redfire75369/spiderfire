[workspace]
members = [
	"cli",
	"ion",
	"ion-proc",
	"modules",
	"runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
ion-proc = { path = "./ion-proc" }
ion = { path = "./ion" }
runtime = { path = "./runtime" }
modules = { path = "./modules" }

arrayvec = "0.7.6"
async-recursion = "1.1.1"
base64 = "0.22.1"
bitflags = "2.9.1"
bytes = "1.10.1"
byteorder = "1.5.0"
bytemuck = "1.23.0"
clap = "4.5.39"
colored = "2.2.0"
const_format = "0.2.34"
convert_case = "0.8.0"
data-url = "0.3.1"
dirs = "6.0.0"
dunce = "1.0.5"
either = "1.15.0"
encoding_rs = "0.8.35"
form_urlencoded = "1.2.1"
futures-channel = "0.3.31"
futures-executor = "0.3.31"
futures-util = "0.3.31"
headers = "0.4.1"
http = "1.3.1"
http-body-util = "0.1.3"
humansize = "2.1.3"
hyper = "1.6.0"
hyper-util = "0.1.13"
idna_adapter = "=1.2.0"
idna = "1.0.3"
indent = "0.1.1"
indexmap = "2.9.0"
itoa = "1.0.15"
mime = "0.3.17"
mozjs = { git = "https://github.com/servo/mozjs" }
pin-project-lite = "0.2.16"
prettyplease = "0.2.33"
proc-macro2 = "1.0.95"
quote = "1.0.40"
rustyline-derive = "0.11.1"
sha3 = "0.10.8"
sourcemap = "9.2.2"
swc_core = "26.3.4"
syn = "2.0.101"
sys-locale = "0.3.2"
typed-arena = "2.0.2"
uri-url = "0.3.0"
url = "2.5.4"
uuid = "1.17.0"
utf16string = "0.2.0"
windows = "0.61.1"

[workspace.dependencies.ascii_table]
version = "4.0.7"
features = ["color_codes", "wide_characters"]

[workspace.dependencies.chrono]
version = "0.4.41"
default-features = false
features = ["clock", "std"]

[workspace.dependencies.hyper-rustls]
version = "0.27.6"
default-features = false

[workspace.dependencies.rustyline]
version = "16.0.0"
default-features = false

[workspace.dependencies.tokio]
version = "1.45.1"
default-features = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
allow_attributes = "forbid"
as_pointer_underscore = "forbid"
as_underscore = "forbid"
assertions_on_result_states = "forbid"
bool_to_int_with_if = "forbid"
borrow_as_ptr = "forbid"
cast_lossless = "forbid"
cast_sign_loss = "forbid"
cfg_not_test = "forbid"
checked_conversions = "forbid"
clone_on_ref_ptr = "forbid"
cloned_instead_of_copied = "forbid"
comparison_chain = "forbid"
copy_iterator = "forbid"
dbg_macro = "forbid"
decimal_literal_representation = "forbid"
default_trait_access = "forbid"
default_union_representation = "forbid"
doc_comment_double_space_linebreaks = "forbid"
doc_link_with_quotes = "forbid"
elidable_lifetime_names = "forbid"
empty_drop = "forbid"
empty_enum_variants_with_brackets = "forbid"
empty_structs_with_brackets = "forbid"
enum_glob_use = "forbid"
exit = "forbid"
expl_impl_clone_on_copy = "forbid"
explicit_deref_methods = "forbid"
explicit_into_iter_loop = "forbid"
explicit_iter_loop = "forbid"
filter_map_next = "forbid"
flat_map_option = "forbid"
fn_params_excessive_bools = "forbid"
fn_to_numeric_cast_any = "forbid"
